name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/factorytwin-3d/package-lock.json
            apps/pointcloud-lab/package-lock.json

      - name: Install FactoryTwin dependencies
        run: npm ci
        working-directory: apps/factorytwin-3d

      - name: Install PointCloud Lab dependencies
        run: npm ci
        working-directory: apps/pointcloud-lab

      - name: Run tests
        run: npm run test
        working-directory: apps/factorytwin-3d

      - name: Build FactoryTwin
        run: npm run build
        working-directory: apps/factorytwin-3d
        env:
          VITE_BASE_PATH: /digital-twin-exploration-lab/factorytwin/

      - name: Build PointCloud Lab
        run: npm run build
        working-directory: apps/pointcloud-lab
        env:
          VITE_BASE_PATH: /digital-twin-exploration-lab/pointcloud/

      - name: Build portal
        run: node scripts/build-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
